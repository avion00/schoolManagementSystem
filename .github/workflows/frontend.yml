name: frontend

on:
  push:
    branches: [main]
    paths: ["frontend/**", "backend/**", ".github/workflows/frontend.yml"]
  pull_request:
    paths: ["frontend/**", "backend/**", ".github/workflows/frontend.yml"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements/*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Backend deps (for the OpenAPI schema)
        working-directory: backend
        run: python -m venv .venv && .venv/bin/pip install -r requirements/base.txt
      - working-directory: frontend
        run: npm ci
      - name: API types are up to date with the backend
        working-directory: frontend
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
        run: npm run api:types && git diff --exit-code -- src/api/openapi.d.ts ../backend/schema.yml
      - working-directory: frontend
        run: npm run typecheck
      - working-directory: frontend
        run: npm test
      - working-directory: frontend
        run: npm run build
