          - teachers
        description: |-
          * `all` - All
          * `students` - Students
          * `parents` - Parents
          * `teachers` - Teachers
          * `staff` - Staff
          * `students_parents` - Students & Parents
      - in: query
        name: category
        schema:
          type: string
          enum:
          - academic
          - emergency
          - event
          - exam
          - fees
          - general
          - holiday
          - hostel
          - library
          - meeting
          - transport
        description: |-
          * `general` - General
          * `exam` - Exam
          * `fees` - Fees
          * `holiday` - Holiday
          * `event` - Event
          * `meeting` - Meeting
          * `emergency` - Emergency
          * `academic` - Academic
          * `transport` - Transport
          * `hostel` - Hostel
          * `library` - Library
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: pinned
        schema:
          type: boolean
      - in: query
        name: priority
        schema:
          type: string
          enum:
          - high
          - low
          - normal
          - urgent
        description: |-
          * `low` - Low
          * `normal` - Normal
          * `high` - High
          * `urgent` - Urgent
      - name: search
        required: false
        in: query
        description: A search term.
