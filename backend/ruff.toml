target-version = "py312"
line-length = 110
extend-exclude = ["**/migrations/**", ".venv"]

[lint]
select = ["E", "F", "W", "I", "B", "DJ", "UP"]
ignore = ["DJ001", "DJ008", "B904", "E501"]  # long lines left to reviewers, not reformatted wholesale

[lint.per-file-ignores]
"config/settings/*.py" = ["F405", "F403"]

[lint.isort]
known-first-party = ["apps", "config", "tests"]
