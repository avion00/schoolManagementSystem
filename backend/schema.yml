components:
  schemas:
    AcademicYear:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        school:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 32
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        is_current:
          type: boolean
        is_active:
          type: boolean
          readOnly: true
      required:
      - end_date
      - id
      - is_active
      - name
      - school
      - start_date
    ActiveInactiveSuspendedEnum:
      enum:
      - active
      - inactive
      - suspended
      type: string
      description: |-
        * `active` - Active
        * `inactive` - Inactive
        * `suspended` - Suspended
    Assignment:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        academic_year:
          type: string
          format: uuid
        class_level:
          type: string
          format: uuid
        class_level_name:
          type: string
          readOnly: true
        section:
          type: string
          format: uuid
          nullable: true
        section_name:
          type: string
          readOnly: true
        subject:
          type: string
          format: uuid
        subject_name:
          type: string
          readOnly: true
        teacher:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        teacher_name:
          type: string
          readOnly: true
        kind:
          $ref: '#/components/schemas/AssignmentKindEnum'
        title:
          type: string
          maxLength: 200
        instructions:
          type: string
        rubric:
          type: string
        due_at:
          type: string
          format: date-time
        max_marks:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,2})?$
          nullable: true
        allow_late:
          type: boolean
        status:
          allOf:
          - $ref: '#/components/schemas/AssignmentStatusEnum'
          readOnly: true
        published_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        attachment_ids:
          type: array
          items:
            type: string
            format: uuid
            writeOnly: true
          writeOnly: true
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/StoredFile'
          readOnly: true
        submissions_count:
          type: integer
          readOnly: true
        graded_count:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - academic_year
      - attachments
      - class_level
      - class_level_name
      - created_at
      - due_at
      - graded_count
      - id
      - published_at
      - section_name
      - status
      - subject
      - subject_name
      - submissions_count
      - teacher
      - teacher_name
      - title
    AssignmentKindEnum:
      enum:
      - homework
      - assignment
      - project
      type: string
      description: |-
        * `homework` - Homework
        * `assignment` - Assignment
        * `project` - Project
    AssignmentStatusEnum:
      enum:
      - draft
      - published
      - closed
      type: string
      description: |-
        * `draft` - Draft
        * `published` - Published
        * `closed` - Closed
    Attendance:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        student:
          type: string
          format: uuid
        student_name:
          type: string
          readOnly: true
        date:
          type: string
          format: date
        status:
          $ref: '#/components/schemas/AttendanceStatusEnum'
        remark:
          type: string
          maxLength: 255
